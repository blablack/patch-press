[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "patch-press"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "pedalboard",
    "mido",
    "numpy",
    "soundfile",
    "lxml",
    "pyyaml",
]

[project.scripts]
patch-press = "patch_press.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/patch_press"]
