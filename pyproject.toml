[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "patch-press"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "patch-render",
    "numpy",
    "soundfile",
    "lxml",
    "pyyaml",
    "librosa",
]

[project.scripts]
patch-press = "patch_press.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/patch_press"]

[tool.ruff]
line-length = 128

[tool.ruff.lint]
extend-ignore = ["E203", "E402"]

[tool.ruff.format]
# black-compatible formatting is the default
