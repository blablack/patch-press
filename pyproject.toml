[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "patch-press"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "patch-render",
    "soundfile",
    "lxml",
    "pyyaml",
    "librosa",
    "soxr",  # resampling for the Bento preview.wav (also a librosa dep)
    'tqdm',
]

[project.scripts]
patch-press = "patch_press.cli:main"

[dependency-groups]
dev = [
    "ruff",       # configured below; not previously installed anywhere
    "matplotlib", # used by .claude/loop-seam-qa/scripts/render_loop_diagnostic.py
]

[tool.hatch.build.targets.wheel]
packages = ["src/patch_press"]

[tool.ruff]
line-length = 128

[tool.ruff.lint]
extend-ignore = ["E203", "E402"]

[tool.ruff.format]
# black-compatible formatting is the default
