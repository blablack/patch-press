# VST preset captured by patch-probe.
# Run with:
#   patch-press sample diva_warmth.yaml --path /media/DELUGE/SYNTHS/Diva --format deluge
source:
  type: vst
  plugin: /path/to/Diva.vst3
  preset: "PAD Warmth"
  raw_state: "<base64 state from patch-probe>"

profile: synth

capture:
  tempo_bpm: 120
  note_step: 3
  duration_s: 8.0
  release_tail_s: 5.0

analysis:
  loop: true
  loop_quality_threshold: 0.8
  normalize: per_set

output:
  name: Diva_Warmth
