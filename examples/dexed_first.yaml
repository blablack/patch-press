# VST preset captured by patch-probe.
# Run with:
#   patch-press sample dexed_first.yaml --path /media/DELUGE/SYNTHS/Dexed --format deluge
source:
  type: vst
  plugin: /path/to/Dexed.vst3
  preset: "BRASS   1"
  raw_state: "<base64 state from patch-probe>"

profile: synth

capture:
  tempo_bpm: 120
  # note_range: [36, 96]
  # note_step: 3
  # velocities: [100]
  # duration_s: 4.0
  # release_tail_s: 2.0

analysis:
  loop: false

output:
  name: Brass1
