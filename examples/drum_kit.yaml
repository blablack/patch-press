# Sample library in kit layout — one subfolder per instrument, WAVs are RR layers.
# Expected structure:
#   /path/to/MyKit/
#     Kick/    *.wav
#     Snare/   *.wav
#     HH/      *.wav
# Run with:
#   patch-press sample drum_kit.yaml --path /media/DELUGE/KITS --format deluge
source:
  type: library
  path: /path/to/MyKit

profile: drums

output:
  name: MyKit
